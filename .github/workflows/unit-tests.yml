name: unit-tests

on:
  push:
  pull_request:

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.head_ref ||
    (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Find completed fork job
      id: reuse
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        jobs=$(python3 .github/workflows/scripts/reuse-ci.py unit-tests)
        echo "url=$(jq -r '.["unit-tests"] // ""' <<< "$jobs")" >> "$GITHUB_OUTPUT"
    - name: Reuse successful fork job
      if: steps.reuse.outputs.url != ''
      env:
        REUSED_JOB: ${{ steps.reuse.outputs.url }}
      run: |
        printf 'Reused successful unit tests for this commit.\n\n[Original job and logs](%s)\n' \
          "$REUSED_JOB" | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Install dependencies
      if: steps.reuse.outputs.url == ''
      run: |
          sudo apt-get update
          .github/workflows/scripts/debian-user-deps.sh valgrind
    - name: Autogen
      if: steps.reuse.outputs.url == ''
      run: |
        ./autogen.sh
    - name: Configure
      if: steps.reuse.outputs.url == ''
      run: |
        mkdir build-sanitizers
        cd build-sanitizers
        ../configure --with-config=user --enable-debug --enable-debuginfo \
          --enable-asan --enable-ubsan
    - name: Unit tests
      if: steps.reuse.outputs.url == ''
      env:
        UBSAN_OPTIONS: print_stacktrace=1
      run: |
        make -C build-sanitizers -j"$(nproc)" unit
    - name: Configure Memcheck
      if: steps.reuse.outputs.url == ''
      run: |
        mkdir build-memcheck
        cd build-memcheck
        ../configure --with-config=user --enable-debug --enable-debuginfo
    - name: Memcheck unit tests
      if: steps.reuse.outputs.url == ''
      run: |
        make -C build-memcheck -j"$(nproc)" unit \
          LOG_COMPILER=valgrind \
          LOG_FLAGS="--quiet --leak-check=full --track-origins=yes \
            --error-exitcode=1 --exit-on-first-error=yes"
