name: labels

on:
  pull_request_target:
    types: [ opened, edited, synchronize, reopened, converted_to_draft, ready_for_review, closed ]
  issues:
    # Only the blocked job runs on these; the other jobs that run on
    # "reopened" check that a PR was reopened.
    types: [ closed, reopened ]
  workflow_dispatch:

permissions:
  pull-requests: write

jobs:
  open:
    runs-on: ubuntu-latest
    if: ${{ github.event.action == 'opened' }}
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.pull_request.html_url }}
          LABEL: "${{ github.event.pull_request.draft && 'Status: Work in Progress' || 'Status: Code Review Needed' }}"
        run: |
          gh pr edit "$ISSUE" --add-label "$LABEL"

  template:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.action == 'opened' || (github.event.action == 'edited' && github.event.pull_request.state == 'open') }}
    concurrency:
      group: template-${{ github.event.pull_request.number || 'all' }}
      # An edit right after opening waits for the run that labels it.
      cancel-in-progress: false
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
        run: |
          # The labels of the boxes ticked in the "Types of Changes" and
          # "Priority" sections of the PR template, and the Type and active
          # Component labels of the issues the PR closes, which take the
          # place of the ticked types since a maintainer chose them.  A PR
          # gets them when it is opened, and later only those of a kind it
          # has no label of yet, so a label set by hand is never
          # overridden.  A priority needs exactly one box ticked.  A manual
          # run labels every open PR.
          boxes='Bug fix|Type: Defect|ededed|
          New feature|Type: Feature|ededed|
          Performance enhancement|Type: Performance|ededed|
          Documentation|Type: Documentation|ededed|
          Critical|Priority: Critical|b60205|Now: data loss or corruption, security, or the build or CI broken for every PR
          High|Priority: High|d93f0b|Next release: panic or hang in normal use, regression, failing tests, planned work
          Medium|Priority: Medium|fbca04|A later release: fixes for uncommon setups, features, performance, test and CI work
          Low|Priority: Low|c2e0c6|Whenever convenient: messages, documentation, cleanups, debug-only issues'
          labels=$(gh label list --limit 1000 --json name --jq '.[].name')
          while IFS='|' read -r box name color desc; do
            if ! grep -qixF "$name" <<< "$labels"; then
              gh label create "$name" --color "$color" --description "$desc"
            fi
          done <<< "$boxes"
          fields=number,body,labels,closingIssuesReferences
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            prs=$(gh pr list --state open --limit 1000 --json "$fields")
          else
            # Read now, not from the event, so that a label added since by
            # the run for an earlier event counts.
            prs=$(gh pr view "$PR" --json "$fields" --jq '[.]')
          fi
          jq -c '.[]' <<< "$prs" | while read -r p; do
            pr=$(jq -r .number <<< "$p")
            have=
            if [ "$ACTION" != opened ]; then
              have=$(jq -r '.labels[].name' <<< "$p")
            fi
            ticked=$(jq -r '.body // ""' <<< "$p" | tr -d '\r' |
                sed -n -E 's/^- \[[xX]\] ([^(]*[^ (]) \(.*/\1/p')
            # At most 10 issues are read; one that cannot be read is skipped.
            issues=$(jq -r --arg repo "$GH_REPO" '[.closingIssuesReferences[] |
                select(.repository.owner.login + "/" + .repository.name ==
                $repo) | .number] | unique | .[:10][]' <<< "$p")
            linked=$(for i in $issues; do
                gh api "repos/$GH_REPO/issues/$i" --jq '.labels[] |
                    select(.archived_at == null) | .name |
                    select(startswith("Type: ") or startswith("Component: "))' \
                    < /dev/null || true
              done | sort -u)
            add=()
            for kind in Type Component Priority; do
              new=$(sed -n "/^$kind: /p" <<< "$linked")
              if [ -z "$new" ]; then
                new=$(while IFS='|' read -r box name _; do
                  if [[ $name = "$kind: "* ]] && grep -qxF "$box" <<< "$ticked"; then
                    echo "$name"
                  fi
                done <<< "$boxes")
              fi
              if [ -z "$new" ] || grep -q "^$kind: " <<< "$have"; then
                continue
              fi
              if [ "$kind" = Priority ] && [ "$(wc -l <<< "$new")" -ne 1 ]; then
                continue
              fi
              while read -r l; do
                add+=(-f "labels[]=$l")
              done <<< "$new"
            done
            if [ ${#add[@]} -ne 0 ]; then
              gh api --silent -X POST "repos/$GH_REPO/issues/$pr/labels" \
                  "${add[@]}" < /dev/null
              # GitHub allows 80 label changes a minute; leave room for
              # the other jobs doing the same.
              if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
                sleep 3
              fi
            fi
          done

  push:
    runs-on: ubuntu-latest
    if: ${{ github.event.action == 'synchronize' || (github.event.action == 'reopened' && github.event_name == 'pull_request_target') }}
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr edit $ISSUE --remove-label "Status: Accepted,Status: Inactive,Status: Revision Needed,Status: Stale"
      # The author has pushed after changes were requested: back to review.
      - if: "${{ !github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'Status: Revision Needed') }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr edit "$ISSUE" --add-label "Status: Code Review Needed"

  area:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.action == 'opened' || github.event.action == 'synchronize' || (github.event.action == 'reopened' && github.event_name == 'pull_request_target') }}
    concurrency:
      group: area-${{ github.event.pull_request.number || 'all' }}
      cancel-in-progress: true
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A PR that changes nothing but CI, tests, documentation or the
          # build and packaging gets the label of each of these it changes.
          # Labels are only added, so labels set by hand stay.  A manual run
          # labels every open PR.
          labels=$(gh label list --limit 1000 --json name --jq '.[].name')
          for l in "Component: CI" "Component: Test Suite" \
              "Type: Documentation" "Type: Building"; do
            if ! grep -qixF "$l" <<< "$labels"; then
              gh label create "$l" --color ededed
            fi
          done
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            prs=$(gh pr list --state open --limit 1000 --json number,labels)
          else
            prs=$(jq '[.pull_request]' "$GITHUB_EVENT_PATH")
          fi
          jq -r '.[] | [.number, ([.labels[].name] | join(","))] | @tsv' \
              <<< "$prs" |
          while IFS=$'\t' read -r pr have; do
            kinds=$(gh api --paginate "repos/$GH_REPO/pulls/$pr/files" \
                --jq '.[].filename' < /dev/null |
                awk '/^\.github\// { print "Component: CI"; next }
                    /^tests\// { print "Component: Test Suite"; next }
                    /^man\// || /\.md$/ { print "Type: Documentation"; next }
                    /^(config|contrib\/debian|rpm)\// || /(^|\/)Makefile\.am$/ ||
                    /^(META|autogen\.sh|configure\.ac|copy-builtin)$/ ||
                    /^(zfs\.release\.in|module\/(Kbuild\.in|Makefile\.(bsd|in)))$/ ||
                    /^scripts\/(dkms\.mkconf|dkms\.postbuild|kmodtool|make_gitrev\.sh)$/ {
                        print "Type: Building"; next }
                    { print "code" }' | sort -u)
            if [ -z "$kinds" ] || grep -qx code <<< "$kinds"; then
              continue
            fi
            while read -r l; do
              if ! tr ',' '\n' <<< "$have" | grep -qxF "$l"; then
                gh api --silent -X POST "repos/$GH_REPO/issues/$pr/labels" \
                    -f "labels[]=$l" < /dev/null
                # GitHub allows 80 label changes a minute; leave room for
                # another job doing the same.
                if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
                  sleep 2
                fi
              fi
            done <<< "$kinds"
          done

  blocked:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.action == 'opened' || (github.event.action == 'edited' && github.event.pull_request.state == 'open') || github.event.action == 'synchronize' || github.event.action == 'reopened' || github.event.action == 'closed' }}
    concurrency:
      # An edit or a push right after a reopening must not cancel the
      # update of the PRs that depend on it.
      group: blocked-${{ (github.event.action == 'closed' || github.event.action == 'reopened') && 'dependents-' || '' }}${{ github.event.pull_request.number || github.event.issue.number || 'all' }}
      cancel-in-progress: true
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          ACTION: ${{ github.event.action }}
        run: |
          # A PR with a line of its description that starts with "Depends
          # on" and one or more PRs or issues of this repository, as "#N",
          # "owner/repo#N" or their URL, is blocked while any of them is
          # open.  Only such PRs get "Status: Blocked" or lose it, so a label
          # set by hand on any other PR stays, as does the label of a PR
          # whose line is deleted.  Only the first 10 dependencies are read,
          # to bound the work of every event, and a PR that names more is
          # told so once, and a PR that names itself is not blocked by it.
          # When a PR or an issue is closed or reopened, the open PRs that
          # depend on it, and a reopened PR itself, are updated; a manual run
          # updates them all.
          label="Status: Blocked"
          marker='<!-- labels-yml:depends-cap -->'
          note="$marker
          This PR names more than 10 PRs or issues on its \"Depends on\" lines.
          Only the first 10 are checked for the \"Status: Blocked\" label."
          labels=$(gh label list --limit 1000 --json name --jq '.[].name')
          if ! grep -qixF "$label" <<< "$labels"; then
            gh label create "$label" --color e60000 \
                --description "Depends on another pending change"
          fi
          sweep=
          if [ "$ACTION" = closed ] || [ "$ACTION" = reopened ]; then
            sweep=true
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] ||
              [ -n "$sweep" ]; then
            prs=$(gh pr list --state open --limit 1000 --json number,body,labels)
          else
            prs=$(gh pr view "$NUMBER" --json number,body,labels --jq '[.]')
          fi
          jq -c '.[]' <<< "$prs" | while read -r p; do
            pr=$(jq -r .number <<< "$p")
            refs=$(jq -r --arg repo "$GH_REPO" '.number as $self |
                "(\($repo)#|#|https://github\\.com/\($repo)/(pull|issues)/)[0-9]+"
                as $ref | "(\\s*,\\s*|\\s+)(and\\s+)?" as $sep |
                [(.body // "") | gsub("\r"; "") | split("\n")[] |
                capture("^depends on( pr| pull request)?:? " +
                    "(?<refs>\($ref)(\($sep)\($ref))*)"; "i").refs |
                scan("(?:#|/(?:pull|issues)/)([0-9]+)")[0] | tonumber |
                select(. != $self)] |
                reduce .[] as $n ([]; if index([$n]) then . else . + [$n] end) |
                .[]' <<< "$p")
            deps=$(head -n 10 <<< "$refs")
            if [ -z "$deps" ] || { [ -n "$sweep" ] && [ "$pr" != "$NUMBER" ] &&
                ! grep -qxF "$NUMBER" <<< "$deps"; }; then
              continue
            fi
            if [ "$(wc -l <<< "$refs")" -gt 10 ] &&
                comments=$(gh api --paginate "repos/$GH_REPO/issues/$pr/comments?per_page=100" \
                    --jq '.[] | select(.user.login == "github-actions[bot]") | .body' \
                    < /dev/null) &&
                ! grep -qF "$marker" <<< "$comments"; then
              gh api --silent -X POST "repos/$GH_REPO/issues/$pr/comments" \
                  -f body="$note" < /dev/null
            fi
            states=$(for n in $deps; do
                gh api "repos/$GH_REPO/issues/$n" --jq .state < /dev/null ||
                    echo unknown
              done)
            # A dependency that cannot be read leaves the PR as it is.
            if grep -qx unknown <<< "$states"; then
              continue
            fi
            blocked=$(grep -qx open <<< "$states" && echo true || echo false)
            has=$(jq --arg l "$label" 'any(.labels[]; .name == $l)' <<< "$p")
            if [ "$blocked" = "$has" ]; then
              continue
            elif [ "$blocked" = true ]; then
              gh api --silent -X POST "repos/$GH_REPO/issues/$pr/labels" \
                  -f "labels[]=$label" < /dev/null
            else
              # Another run may have removed it already.
              gh api --silent -X DELETE \
                  "repos/$GH_REPO/issues/$pr/labels/Status:%20Blocked" \
                  < /dev/null || true
            fi
            # GitHub allows 80 label changes a minute; leave room for the
            # other jobs doing the same.
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] ||
                [ -n "$sweep" ]; then
              sleep 3
            fi
          done

  draft:
    runs-on: ubuntu-latest
    if: ${{ github.event.action == 'converted_to_draft' }}
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr edit $ISSUE --remove-label "Status: Accepted,Status: Code Review Needed,Status: Inactive,Status: Revision Needed,Status: Stale" --add-label "Status: Work in Progress"

  rfr:
    runs-on: ubuntu-latest
    if: ${{ github.event.action == 'ready_for_review' }}
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr edit $ISSUE --remove-label "Status: Accepted,Status: Inactive,Status: Revision Needed,Status: Stale,Status: Work in Progress" --add-label "Status: Code Review Needed"

  size:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.action == 'opened' || github.event.action == 'synchronize' || (github.event.action == 'reopened' && github.event_name == 'pull_request_target') }}
    concurrency:
      group: size-${{ github.event.pull_request.number || 'all' }}
      cancel-in-progress: true
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # OpenZFS PR size classes, from the lines added plus removed as
          # the PR page shows them.  A manual run labels every open PR,
          # and can be repeated.
          labels=$(gh label list --limit 1000 --json name --jq '.[].name')
          for l in "Size: XS|d4e9f7|Fewer than 10 lines changed" \
              "Size: S|c5def5|10 to 29 lines changed" \
              "Size: M|9cc8f0|30 to 99 lines changed" \
              "Size: L|5a9be0|100 to 499 lines changed" \
              "Size: XL|1d76db|500 to 999 lines changed" \
              "Size: XXL|0b4ea2|1000 or more lines changed"; do
            IFS='|' read -r name color desc <<< "$l"
            if ! grep -qxF "$name" <<< "$labels"; then
              gh label create "$name" --color "$color" --description "$desc"
            fi
          done
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            prs=$(gh pr list --state open --limit 1000 \
                --json number,additions,deletions,labels)
          else
            prs=$(jq '[.pull_request]' "$GITHUB_EVENT_PATH")
          fi
          jq -r '.[] | [.number, .additions + .deletions,
              ([.labels[].name | select(startswith("Size: "))] | join(","))]
              | @tsv' <<< "$prs" |
          while IFS=$'\t' read -r pr lines old; do
            if [ "$lines" -lt 10 ]; then
              new="Size: XS"
            elif [ "$lines" -lt 30 ]; then
              new="Size: S"
            elif [ "$lines" -lt 100 ]; then
              new="Size: M"
            elif [ "$lines" -lt 500 ]; then
              new="Size: L"
            elif [ "$lines" -lt 1000 ]; then
              new="Size: XL"
            else
              new="Size: XXL"
            fi
            [ "$old" = "$new" ] && continue
            gh api --silent -X POST "repos/$GH_REPO/issues/$pr/labels" \
                -f "labels[]=$new" < /dev/null
            tr ',' '\n' <<< "$old" | while read -r l; do
              [ -z "$l" ] || [ "$l" = "$new" ] || gh api --silent -X DELETE \
                  "repos/$GH_REPO/issues/$pr/labels/$(jq -rn --arg l "$l" '$l | @uri')"
            done
            # GitHub allows 80 label changes a minute; leave room for
            # another job doing the same.
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              sleep 2
            fi
          done
