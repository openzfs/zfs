name: labels

on:
  pull_request_target:
    types: [ opened, edited, synchronize, reopened, converted_to_draft, ready_for_review ]
  workflow_dispatch:

permissions:
  pull-requests: write

jobs:
  open:
    runs-on: ubuntu-latest
    if: ${{ github.event.action == 'opened' && github.event.pull_request.draft }}
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr edit $ISSUE --add-label "Status: Work in Progress"

  template:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.action == 'opened' || (github.event.action == 'edited' && github.event.pull_request.state == 'open') }}
    concurrency:
      group: template-${{ github.event.pull_request.number || 'all' }}
      # An edit right after opening waits for the run that labels it.
      cancel-in-progress: false
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
        run: |
          # The labels of the boxes ticked in the "Types of Changes" and
          # "Priority" sections of the PR template.  A PR gets them when it
          # is opened, and later only those of a kind it has no label of
          # yet, so a label set by hand is never overridden.  A priority
          # needs exactly one box ticked.  A manual run labels every open
          # PR.
          boxes='Bug fix|Type: Defect|ededed|
          New feature|Type: Feature|ededed|
          Performance enhancement|Type: Performance|ededed|
          Documentation|Type: Documentation|ededed|
          Critical|Priority: Critical|b60205|Now: data loss or corruption, security, or the build or CI broken for every PR
          High|Priority: High|d93f0b|Next release: panic or hang in normal use, regression, failing tests, planned work
          Medium|Priority: Medium|fbca04|A later release: fixes for uncommon setups, features, performance, test and CI work
          Low|Priority: Low|c2e0c6|Whenever convenient: messages, documentation, cleanups, debug-only issues'
          labels=$(gh label list --limit 1000 --json name --jq '.[].name')
          while IFS='|' read -r box name color desc; do
            if ! grep -qixF "$name" <<< "$labels"; then
              gh label create "$name" --color "$color" --description "$desc"
            fi
          done <<< "$boxes"
          fields=number,body,labels
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            prs=$(gh pr list --state open --limit 1000 --json "$fields")
          else
            # Read now, not from the event, so that a label added since by
            # the run for an earlier event counts.
            prs=$(gh pr view "$PR" --json "$fields" --jq '[.]')
          fi
          jq -c '.[]' <<< "$prs" | while read -r p; do
            pr=$(jq -r .number <<< "$p")
            have=
            if [ "$ACTION" != opened ]; then
              have=$(jq -r '.labels[].name' <<< "$p")
            fi
            ticked=$(jq -r '.body // ""' <<< "$p" | tr -d '\r' |
                sed -n -E 's/^- \[[xX]\] ([^(]*[^ (]) \(.*/\1/p')
            add=()
            for kind in Type Priority; do
              new=$(while IFS='|' read -r box name _; do
                if [[ $name = "$kind: "* ]] && grep -qxF "$box" <<< "$ticked"; then
                  echo "$name"
                fi
              done <<< "$boxes")
              if [ -z "$new" ] || grep -q "^$kind: " <<< "$have"; then
                continue
              fi
              if [ "$kind" = Priority ] && [ "$(wc -l <<< "$new")" -ne 1 ]; then
                continue
              fi
              while read -r l; do
                add+=(-f "labels[]=$l")
              done <<< "$new"
            done
            if [ ${#add[@]} -ne 0 ]; then
              gh api --silent -X POST "repos/$GH_REPO/issues/$pr/labels" \
                  "${add[@]}" < /dev/null
              # GitHub allows 80 label changes a minute; leave room for
              # the other jobs doing the same.
              if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
                sleep 3
              fi
            fi
          done

  push:
    runs-on: ubuntu-latest
    if: ${{ github.event.action == 'synchronize' || github.event.action == 'reopened' }}
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr edit $ISSUE --remove-label "Status: Accepted,Status: Inactive,Status: Revision Needed,Status: Stale"

  area:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened' }}
    concurrency:
      group: area-${{ github.event.pull_request.number || 'all' }}
      cancel-in-progress: true
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A PR that changes nothing but CI, tests or documentation gets
          # the label of each of these it changes.  Labels are only added,
          # so labels set by hand stay.  A manual run labels every open PR.
          labels=$(gh label list --limit 1000 --json name --jq '.[].name')
          for l in "Component: CI" "Component: Test Suite" \
              "Type: Documentation"; do
            if ! grep -qxF "$l" <<< "$labels"; then
              gh label create "$l" --color ededed
            fi
          done
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            prs=$(gh pr list --state open --limit 1000 --json number,labels)
          else
            prs=$(jq '[.pull_request]' "$GITHUB_EVENT_PATH")
          fi
          jq -r '.[] | [.number, ([.labels[].name] | join(","))] | @tsv' \
              <<< "$prs" |
          while IFS=$'\t' read -r pr have; do
            kinds=$(gh api --paginate "repos/$GH_REPO/pulls/$pr/files" \
                --jq '.[].filename' < /dev/null |
                awk '/^\.github\// { print "Component: CI"; next }
                    /^tests\// { print "Component: Test Suite"; next }
                    /^man\// || /\.md$/ { print "Type: Documentation"; next }
                    { print "code" }' | sort -u)
            if [ -z "$kinds" ] || grep -qx code <<< "$kinds"; then
              continue
            fi
            while read -r l; do
              if ! tr ',' '\n' <<< "$have" | grep -qxF "$l"; then
                gh api --silent -X POST "repos/$GH_REPO/issues/$pr/labels" \
                    -f "labels[]=$l" < /dev/null
                # GitHub allows 80 label changes a minute; leave room for
                # another job doing the same.
                if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
                  sleep 2
                fi
              fi
            done <<< "$kinds"
          done

  draft:
    runs-on: ubuntu-latest
    if: ${{ github.event.action == 'converted_to_draft' }}
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr edit $ISSUE --remove-label "Status: Accepted,Status: Code Review Needed,Status: Inactive,Status: Revision Needed,Status: Stale" --add-label "Status: Work in Progress"

  rfr:
    runs-on: ubuntu-latest
    if: ${{ github.event.action == 'ready_for_review' }}
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr edit $ISSUE --remove-label "Status: Accepted,Status: Inactive,Status: Revision Needed,Status: Stale,Status: Work in Progress" --add-label "Status: Code Review Needed"

  size:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened' }}
    concurrency:
      group: size-${{ github.event.pull_request.number || 'all' }}
      cancel-in-progress: true
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # OpenZFS PR size classes, from the lines added plus removed as
          # the PR page shows them.  A manual run labels every open PR,
          # and can be repeated.
          labels=$(gh label list --limit 1000 --json name --jq '.[].name')
          for l in "Size: XS|d4e9f7|Fewer than 10 lines changed" \
              "Size: S|c5def5|10 to 29 lines changed" \
              "Size: M|9cc8f0|30 to 99 lines changed" \
              "Size: L|5a9be0|100 to 499 lines changed" \
              "Size: XL|1d76db|500 to 999 lines changed" \
              "Size: XXL|0b4ea2|1000 or more lines changed"; do
            IFS='|' read -r name color desc <<< "$l"
            if ! grep -qxF "$name" <<< "$labels"; then
              gh label create "$name" --color "$color" --description "$desc"
            fi
          done
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            prs=$(gh pr list --state open --limit 1000 \
                --json number,additions,deletions,labels)
          else
            prs=$(jq '[.pull_request]' "$GITHUB_EVENT_PATH")
          fi
          jq -r '.[] | [.number, .additions + .deletions,
              ([.labels[].name | select(startswith("Size: "))] | join(","))]
              | @tsv' <<< "$prs" |
          while IFS=$'\t' read -r pr lines old; do
            if [ "$lines" -lt 10 ]; then
              new="Size: XS"
            elif [ "$lines" -lt 30 ]; then
              new="Size: S"
            elif [ "$lines" -lt 100 ]; then
              new="Size: M"
            elif [ "$lines" -lt 500 ]; then
              new="Size: L"
            elif [ "$lines" -lt 1000 ]; then
              new="Size: XL"
            else
              new="Size: XXL"
            fi
            [ "$old" = "$new" ] && continue
            gh api --silent -X POST "repos/$GH_REPO/issues/$pr/labels" \
                -f "labels[]=$new" < /dev/null
            tr ',' '\n' <<< "$old" | while read -r l; do
              [ -z "$l" ] || [ "$l" = "$new" ] || gh api --silent -X DELETE \
                  "repos/$GH_REPO/issues/$pr/labels/$(jq -rn --arg l "$l" '$l | @uri')"
            done
            # GitHub allows 80 label changes a minute; leave room for
            # another job doing the same.
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              sleep 2
            fi
          done
