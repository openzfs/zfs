name: "CodeQL"

on:
  push:
  pull_request:

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.head_ref ||
    (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp', 'python' ]

    steps:
    - name: Set make jobs
      run: |
        echo "MAKEFLAGS=-j$(nproc)" >> $GITHUB_ENV

    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Initialize CodeQL
      id: codeql
      uses: github/codeql-action/init@v4
      with:
        config-file: .github/codeql-${{ matrix.language }}.yml
        languages: ${{ matrix.language }}

    - name: Test custom CodeQL queries
      if: matrix.language == 'cpp'
      env:
        CODEQL: ${{ steps.codeql.outputs.codeql-path }}
      run: |
        "$CODEQL" pack ci -- .github/codeql/custom-queries/cpp
        "$CODEQL" pack ci -- .github/codeql/custom-queries/cpp-tests
        "$CODEQL" test run --threads=0 -- \
          .github/codeql/custom-queries/cpp-tests

    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
