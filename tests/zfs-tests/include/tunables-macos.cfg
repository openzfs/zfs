# This file provides macOS (Darwin) sysctl tunable names for the test suite.
# It is sourced after tunables.cfg on Darwin to override variable values with
# macOS-specific names used via:
#   sysctl kstat.zfs.darwin.tunable.<value>
#
# Names must match entries in tunables.cfg. Keep the table sorted
# alphabetically. Use UNSUPPORTED for tunables not implemented on macOS.

# NAME					macOS tunable
