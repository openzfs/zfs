. $STF_SUITE/include/libtest.shlib

export DISK_ARRAY_NUM=0

function set_disks
{
	set -A disk_array $(find_disks $DISKS)

	if (( ${#disk_array[*]} <= 1 )); then
		export DISK=${DISKS%% *}
	else
		export DISK=""
		typeset -i i=0
		while (( i < ${#disk_array[*]} )); do
			export DISK${i}="${disk_array[$i]}"
			DISKSARRAY="$DISKSARRAY ${disk_array[$i]}"
			(( i = i + 1 ))
		done
		export DISK_ARRAY_NUM=$i
		export DISKSARRAY
	fi

	if (( $DISK_ARRAY_NUM == 0 )); then
		export disk=$DISK
	else
		export disk=$DISK0
	fi
}

set_disks
set_device_dir

export SIZE=$MINVDEVSIZE

export VDIR=$TESTDIR/disk.cache
export VDIR2=$TESTDIR/disk2.cache
# File vdevs for L2ARC tests.  On NetBSD the live-image root is ~2G
# and TESTDIR may be a directory on that root before a pool is
# mounted; keep the images on TEST_BASE_DIR (the build disk).
if [ "$(uname)" = "NetBSD" ] && [ -n "$TEST_BASE_DIR" ]; then
	export VDIR=$TEST_BASE_DIR/disk.cache
	export VDIR2=$TEST_BASE_DIR/disk2.cache
fi

export VDEV="$VDIR/a $VDIR/b $VDIR/c"
export VDEV2="$VDIR2/a $VDIR2/b $VDIR2/c"

# L2ARC devices.  Prefer extra ZTS disks when the runner supplied
# at least two.  A single extra virtio (or none) must not leave
# LDEV/LDEV2 empty — that makes cache_001 fail with "cache requires
# at least 1 devices" and the rest log_untested.  Dedicated files
# keep the group runnable.
if [ -n "${DISK0:-}" ] && [ -n "${DISK1:-}" ]; then
	export LDEV="$DISK0"
	export LDEV2="$DISK1"
else
	export LDEV="$VDIR/l2arc0"
	export LDEV2="$VDIR2/l2arc1"
fi
