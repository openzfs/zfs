# Large file size (bytes) — large enough to miss the ARC and exercise the
# on-disk read path.
export ASYNC_FILESIZE=67108864
export ASYNC_FILESIZE_HR="64M"

# Small file size (bytes) — resident in the ARC.
export ASYNC_SMALL_FILESIZE=8388608
export ASYNC_SMALL_FILESIZE_HR="8M"

# Block size (bytes) — 4 KiB, matches the recordsize set in setup.ksh so
# O_DIRECT requests are block aligned.
export ASYNC_BS=4096
export ASYNC_BS_HR="4K"
