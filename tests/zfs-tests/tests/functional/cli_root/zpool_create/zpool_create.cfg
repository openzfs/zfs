012345678901234567890123456789\
012345678901234567890123456789\
012345678901234567890123456789\
012345678901234567890123456789\
012345678901234567890123456789"

export TOOSMALL="toosmall"

export TESTPOOL4=testpool4.create
export TESTPOOL5=testpool5.create
