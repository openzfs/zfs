. $STF_SUITE/include/libtest.shlib

export DISK_ARRAY_NUM=$(echo ${DISKS} | awk '{print NF}')
read -r DISK1 _ DISK2 _ <<<"$DISKS"
export DISK1 DISK2

if is_linux; then
	set_slice_prefix
	set_device_dir
	devs_id[0]=$(get_persistent_disk_name $DISK1)
	devs_id[1]=$(get_persistent_disk_name $DISK2)
else
	DEV_DSKDIR="/dev"
fi
