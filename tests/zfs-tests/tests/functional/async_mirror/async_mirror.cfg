#
# The vdevs of the async_mirror tests are sparse files in one directory.
# The two children of the test mirror are the leader and the lagging
# child.  The extra files are for the tests that need more top-level
# vdevs.
#
ASYNC_MIRROR_DIR="$TEST_BASE_DIR/async_mirror"
ASYNC_MIRROR_VDEV_SIZE=128m
ASYNC_MIRROR_LEADER="$ASYNC_MIRROR_DIR/leader"
ASYNC_MIRROR_LAGGING="$ASYNC_MIRROR_DIR/lagging"
ASYNC_MIRROR_EXTRA="$ASYNC_MIRROR_DIR/extra"
ASYNC_MIRROR_REPLACEMENT="$ASYNC_MIRROR_DIR/replacement"
ASYNC_MIRROR_VDEVS="$ASYNC_MIRROR_LEADER $ASYNC_MIRROR_LAGGING \
	$ASYNC_MIRROR_EXTRA $ASYNC_MIRROR_REPLACEMENT"

#
# A test that imports the lagging child alone moves the leader here, out of
# the directory that the import scans.
#
ASYNC_MIRROR_HIDDEN="$TEST_BASE_DIR/async_mirror_leader.hidden"

#
# A test that imports the leader alone moves the lagging child here.
#
ASYNC_MIRROR_LAGGING_HIDDEN="$TEST_BASE_DIR/async_mirror_lagging.hidden"

#
# The number of seconds that a test waits for the lagging child to catch
# up, or for the feature to change its state.
#
ASYNC_MIRROR_TIMEOUT=120
